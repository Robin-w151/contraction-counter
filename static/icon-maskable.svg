<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Contraction Counter">
	<rect width="64" height="64" fill="#282a36"/>
	<!-- Scaled about the centre so an arbitrary maskable crop (circle, squircle,
	     teardrop) never reaches the ring: Android only guarantees the middle 80%. -->
	<g transform="translate(32 32) scale(0.72) translate(-32 -32)">
		<circle cx="32" cy="32" r="26" fill="none" stroke="#bd93f9" stroke-width="5"/>
		<path d="M 16 38 L 20 38 C 23 38 23.5 22 29 22 C 34.5 22 36 38 42 38 L 48 38"
			fill="none" stroke="#ff79c6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
	</g>
</svg>
